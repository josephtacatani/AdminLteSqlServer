version: '3.8'

services:
  # Microsoft SQL Server Database Service
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest 
    container_name: sqlserver
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_AGENT_ENABLED: "true"          # Enables SQL Server Agent (optional)
      MSSQL_TLS_ENABLED: "false"           # Disable TLS encryption (for local/dev use)
    ports:
      - "1433:1433"
    volumes:
      - ./backup:/var/opt/mssql/backup
      - sqlserver-data:/var/opt/mssql/data
    user: "0:0"  # Run as roo
    

  # Adminer (Alternative to phpMyAdmin for SQL Server)
  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: sqlserver
    depends_on:
      - sqlserver

  # Node.js Backend API Service
  # nodejs-api:
  #   build:
  #     context: .
  #   container_name: nodejs-api
  #   ports:
  #     - "8082:8082"
