  #     - sqlserver
  #   environment:
  #     DB_HOST: sqlserver
  #     DB_PORT: 1433
  #     DB_USER: sa
  #     DB_PASSWORD: "YourStrong!Passw0rd"
  #     DB_DATABASE: dental_app

volumes:
  sqlserver-data: